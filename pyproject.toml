# AI ASSISTANTS: Read _AI_CONTEXT.md for complete project context!
[project]
authors = [{name = "roelanddeheld", email = "roelandnieboer@gmail.com"}]
dependencies = []
name = "FusionFiber"
requires-python = ">= 3.11"
version = "0.1.0"
description = "Measuring darcy flux at geothermal wells using multi fiber core AH-DTS Analysis"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.tasks]
ates-research = { cmd = "python data/ates_action_research.py", description = "Read, process and custom plotting from raw ATES data: processed data can be loaded to the ATES-app" }
ates-app = { cmd = "python ates-app/ates_qc_interactive_viewer.py", description = "Run the interactive ATES QC viewer using the default combined pickle path" }
ates-app-nobrowser = { cmd = "python ates-app/ates_qc_interactive_viewer.py --no-browser", description = "Run the interactive ATES QC viewer without auto-opening a browser tab" }
compile-check-ates-app = { cmd = "python -m py_compile ates-app/ates_qc_interactive_viewer.py", description = "Compile-check the ATES QC viewer script" }

[tool.pixi.dependencies]
pandas = ">=2.3.3,<3"
numpy = ">=2.3.3,<3"
xmltodict = ">=1.0.2,<2"
yaml = ">=0.2.5,<0.3"
pyyaml = ">=6.0.3,<7"
ipykernel = ">=7.0.1,<8"
jinja2 = ">=3.1.6,<4"
matplotlib = ">=3.10.7,<4"
ffmpeg = ">=8.0.0,<9"
dash = ">=4.1.0,<5"
plotly = ">=6.6.0,<7"
