[project]
authors = [{name = "roelanddeheld", email = "roelandnieboer@gmail.com"}]
dependencies = []
name = "FusionFiber"
requires-python = ">= 3.11"
version = "0.1.0"
description = "Measuring darcy flux at geothermal wells using multi fiber core AH-DTS Analysis"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.tasks]

[tool.pixi.dependencies]
pandas = ">=2.3.3,<3"
numpy = ">=2.3.3,<3"
xmltodict = ">=1.0.2,<2"
yaml = ">=0.2.5,<0.3"
pyyaml = ">=6.0.3,<7"
ipykernel = ">=7.0.1,<8"
jinja2 = ">=3.1.6,<4"
matplotlib = ">=3.10.7,<4"
